name: Operational Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main candidate SHA
        required: true
        type: string
      manifest_path:
        description: Repository-relative readiness evidence manifest path
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${MANIFEST_PATH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${MANIFEST_PATH}" != /* ]]
          [[ "${MANIFEST_PATH}" != *".."* ]]

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify candidate identity and protected-main ancestry
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main

      - name: Validate operational readiness evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          test -f "${MANIFEST_PATH}"
          test ! -L "${MANIFEST_PATH}"
          python scripts/validate_operational_readiness_evidence.py \
            "${MANIFEST_PATH}" \
            --repository-root . \
            --expected-candidate "${CANDIDATE_SHA}" \
            --output operational-readiness-snapshot.json

      - name: Upload non-secret readiness snapshot
        uses: actions/upload-artifact@v4
        with:
          name: operational-readiness-${{ inputs.candidate_sha }}
          path: operational-readiness-snapshot.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish authorization boundary
        run: echo "Readiness aggregation does not activate deployment, registration, beta, payments, billing, or general availability." >> "${GITHUB_STEP_SUMMARY}"
