name: Public Operations Evidence Manifest

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main candidate SHA
        required: true
        type: string
      manifest_path:
        description: Repository-relative manifest JSON path
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${MANIFEST_PATH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${MANIFEST_PATH}" != /* ]]
          [[ "${MANIFEST_PATH}" != *".."* ]]

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify candidate identity and protected-main ancestry
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main

      - name: Validate bound public operations evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          test -f "${MANIFEST_PATH}"
          test ! -L "${MANIFEST_PATH}"
          python scripts/validate_public_operations_evidence_manifest.py \
            "${MANIFEST_PATH}" \
            --repository-root . \
            --expected-candidate "${CANDIDATE_SHA}" \
            --output public-operations-evidence-report.json

      - name: Upload non-secret validation report
        uses: actions/upload-artifact@v4
        with:
          name: public-operations-evidence-${{ inputs.candidate_sha }}
          path: public-operations-evidence-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish authorization boundary
        run: |
          echo "This repository validation binds file bytes and decisions only. It does not prove live operations, staffing, legal compliance, deployment, registration, controlled beta, payments, production billing, or general availability." >> "${GITHUB_STEP_SUMMARY}"
