name: Public Operations Evidence Reconciliation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main candidate SHA
        required: true
        type: string
      record_path:
        description: Repository-relative reconciliation JSON path
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RECORD_PATH: ${{ inputs.record_path }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RECORD_PATH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${RECORD_PATH}" != /* ]]
          [[ "${RECORD_PATH}" != *".."* ]]

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify candidate identity and protected-main ancestry
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main

      - name: Validate complete evidence chain
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RECORD_PATH: ${{ inputs.record_path }}
        run: |
          set -euo pipefail
          test -f "${RECORD_PATH}"
          test ! -L "${RECORD_PATH}"
          python scripts/validate_public_operations_evidence_reconciliation.py \
            "${RECORD_PATH}" \
            --repository-root . \
            --expected-candidate "${CANDIDATE_SHA}" \
            --output public-operations-evidence-reconciliation-report.json

      - name: Upload non-secret reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: public-operations-evidence-reconciliation-${{ inputs.candidate_sha }}
          path: public-operations-evidence-reconciliation-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish authorization boundary
        run: echo "This reconciles repository evidence only and does not activate deployment, registration, controlled beta, payments, billing, or general availability." >> "${GITHUB_STEP_SUMMARY}"
