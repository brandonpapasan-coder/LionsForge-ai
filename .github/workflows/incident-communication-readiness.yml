name: Incident Communication Readiness

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main candidate SHA
        required: true
        type: string
      record_path:
        description: Repository-relative readiness JSON path
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RECORD_PATH: ${{ inputs.record_path }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RECORD_PATH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${RECORD_PATH}" != /* ]]
          [[ "${RECORD_PATH}" != *".."* ]]

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify candidate identity and protected-main ancestry
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main

      - name: Validate incident communication readiness
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RECORD_PATH: ${{ inputs.record_path }}
        run: |
          set -euo pipefail
          test -f "${RECORD_PATH}"
          test ! -L "${RECORD_PATH}"
          python scripts/validate_incident_communication_readiness.py \
            "${RECORD_PATH}" \
            --expected-candidate "${CANDIDATE_SHA}" \
            --output incident-communication-readiness-report.json

      - name: Upload non-secret validation report
        uses: actions/upload-artifact@v4
        with:
          name: incident-communication-readiness-${{ inputs.candidate_sha }}
          path: incident-communication-readiness-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish authorization boundary
        run: |
          echo "This repository validation does not prove live status infrastructure, staffing, legal notification compliance, deployment, registration, controlled beta, payments, production billing, or general availability." >> "${GITHUB_STEP_SUMMARY}"
