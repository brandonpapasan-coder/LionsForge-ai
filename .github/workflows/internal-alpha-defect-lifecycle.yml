name: Internal Alpha Defect Lifecycle

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main candidate SHA
        required: true
        type: string
      manifest_path:
        description: Repository-relative defect lifecycle manifest path
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${MANIFEST_PATH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${MANIFEST_PATH}" != /* ]]
          [[ "${MANIFEST_PATH}" != *".."* ]]
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify candidate identity and protected-main ancestry
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main
      - name: Validate internal-alpha defect lifecycle
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          test -f "${MANIFEST_PATH}"
          test ! -L "${MANIFEST_PATH}"
          python scripts/validate_internal_alpha_defect_lifecycle.py \
            "${MANIFEST_PATH}" \
            --expected-candidate "${CANDIDATE_SHA}" \
            --output internal-alpha-defect-lifecycle-report.json
      - name: Upload non-secret defect report
        uses: actions/upload-artifact@v4
        with:
          name: internal-alpha-defect-lifecycle-${{ inputs.candidate_sha }}
          path: internal-alpha-defect-lifecycle-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish authorization boundary
        run: echo "Defect lifecycle validation does not expose defects publicly, create accounts or credentials, enable external beta, production deployment, payments, billing, or general availability." >> "${GITHUB_STEP_SUMMARY}"
