name: Production Observability Bootstrap

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character lowercase main-branch release SHA
        required: true
        type: string
      confirmation:
        description: Type CONFIGURE-OBSERVABILITY to apply scaling and alarms
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: onyxmane-production-observability-bootstrap
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_PRODUCTION_CLUSTER }}
      BACKEND_SERVICE: ${{ vars.ECS_PRODUCTION_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.ECS_PRODUCTION_FRONTEND_SERVICE }}
      RDS_DB_INSTANCE_IDENTIFIER: ${{ vars.RDS_PRODUCTION_DB_INSTANCE_IDENTIFIER }}
      ALB_ARN: ${{ vars.PRODUCTION_ALB_ARN }}
      BACKEND_TARGET_GROUP_ARN: ${{ vars.PRODUCTION_BACKEND_TARGET_GROUP_ARN }}
      FRONTEND_TARGET_GROUP_ARN: ${{ vars.PRODUCTION_FRONTEND_TARGET_GROUP_ARN }}
      ALERT_TOPIC_ARN: ${{ vars.PRODUCTION_ALERT_SNS_TOPIC_ARN }}
      MIN_CAPACITY: ${{ vars.ECS_PRODUCTION_MIN_CAPACITY || '1' }}
      MAX_CAPACITY: ${{ vars.ECS_PRODUCTION_MAX_CAPACITY || '4' }}

    steps:
      - name: Validate guarded inputs
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be an exact lowercase SHA" >&2; exit 1; }
          test "${CONFIRMATION}" = "CONFIGURE-OBSERVABILITY"
          for value in "${AWS_REGION}" "${ECS_CLUSTER}" "${BACKEND_SERVICE}" "${FRONTEND_SERVICE}" "${RDS_DB_INSTANCE_IDENTIFIER}" "${ALERT_TOPIC_ARN}"; do
            test -n "${value}"
          done
          [[ "${ALERT_TOPIC_ARN}" =~ ^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:.+ ]] || { echo "PRODUCTION_ALERT_SNS_TOPIC_ARN must be a valid SNS topic ARN" >&2; exit 1; }
          [[ "${MIN_CAPACITY}" =~ ^[0-9]+$ && "${MAX_CAPACITY}" =~ ^[0-9]+$ ]]
          test "${MIN_CAPACITY}" -ge 1
          test "${MAX_CAPACITY}" -ge "${MIN_CAPACITY}"
          test "${MAX_CAPACITY}" -le 20

      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Confirm release is contained in main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate production resources before mutation
        run: |
          set -euo pipefail
          aws sns get-topic-attributes --topic-arn "${ALERT_TOPIC_ARN}" >/dev/null
          aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${BACKEND_SERVICE}" "${FRONTEND_SERVICE}" \
            --query 'services[].status' --output text | tr '\t' '\n' | grep -qx ACTIVE
          aws rds describe-db-instances --db-instance-identifier "${RDS_DB_INSTANCE_IDENTIFIER}" \
            --query 'DBInstances[0].DBInstanceStatus' --output text | grep -qx available

      - name: Configure bounded ECS target tracking
        run: |
          set -euo pipefail
          for service in "${BACKEND_SERVICE}" "${FRONTEND_SERVICE}"; do
            resource_id="service/${ECS_CLUSTER}/${service}"
            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --resource-id "${resource_id}" \
              --scalable-dimension ecs:service:DesiredCount \
              --min-capacity "${MIN_CAPACITY}" \
              --max-capacity "${MAX_CAPACITY}"

            jq -n '{TargetValue:60.0,PredefinedMetricSpecification:{PredefinedMetricType:"ECSServiceAverageCPUUtilization"},ScaleInCooldown:300,ScaleOutCooldown:60,DisableScaleIn:false}' > target-tracking.json
            aws application-autoscaling put-scaling-policy \
              --policy-name "onyxmane-${service}-cpu-target" \
              --service-namespace ecs \
              --resource-id "${resource_id}" \
              --scalable-dimension ecs:service:DesiredCount \
              --policy-type TargetTrackingScaling \
              --target-tracking-scaling-policy-configuration file://target-tracking.json >/dev/null
          done

      - name: Configure ECS service alarms
        run: |
          set -euo pipefail
          for service in "${BACKEND_SERVICE}" "${FRONTEND_SERVICE}"; do
            for metric in CPUUtilization MemoryUtilization; do
              suffix="cpu"
              [ "${metric}" = "MemoryUtilization" ] && suffix="memory"
              aws cloudwatch put-metric-alarm \
                --alarm-name "onyxmane-production-${service}-${suffix}-high" \
                --alarm-description "OnyxMane production ${service} ${metric} sustained above 80 percent" \
                --namespace AWS/ECS \
                --metric-name "${metric}" \
                --dimensions Name=ClusterName,Value="${ECS_CLUSTER}" Name=ServiceName,Value="${service}" \
                --statistic Average \
                --period 60 \
                --evaluation-periods 5 \
                --datapoints-to-alarm 3 \
                --threshold 80 \
                --comparison-operator GreaterThanOrEqualToThreshold \
                --treat-missing-data missing \
                --alarm-actions "${ALERT_TOPIC_ARN}" \
                --ok-actions "${ALERT_TOPIC_ARN}"
            done
          done

      - name: Configure database alarms
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-alarm \
            --alarm-name onyxmane-production-rds-cpu-high \
            --alarm-description "OnyxMane production RDS CPU sustained above 80 percent" \
            --namespace AWS/RDS \
            --metric-name CPUUtilization \
            --dimensions Name=DBInstanceIdentifier,Value="${RDS_DB_INSTANCE_IDENTIFIER}" \
            --statistic Average --period 60 --evaluation-periods 5 --datapoints-to-alarm 3 \
            --threshold 80 --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data missing --alarm-actions "${ALERT_TOPIC_ARN}" --ok-actions "${ALERT_TOPIC_ARN}"

          aws cloudwatch put-metric-alarm \
            --alarm-name onyxmane-production-rds-free-storage-low \
            --alarm-description "OnyxMane production RDS free storage below 5 GiB" \
            --namespace AWS/RDS \
            --metric-name FreeStorageSpace \
            --dimensions Name=DBInstanceIdentifier,Value="${RDS_DB_INSTANCE_IDENTIFIER}" \
            --statistic Average --period 300 --evaluation-periods 2 --datapoints-to-alarm 2 \
            --threshold 5368709120 --comparison-operator LessThanThreshold \
            --treat-missing-data breaching --alarm-actions "${ALERT_TOPIC_ARN}" --ok-actions "${ALERT_TOPIC_ARN}"

      - name: Configure ALB target error alarms when identifiers are available
        if: env.ALB_ARN != '' && env.BACKEND_TARGET_GROUP_ARN != '' && env.FRONTEND_TARGET_GROUP_ARN != ''
        run: |
          set -euo pipefail
          ALB_FULL_NAME="$(aws elbv2 describe-load-balancers --load-balancer-arns "${ALB_ARN}" --query 'LoadBalancers[0].LoadBalancerArn' --output text | sed 's#^.*:loadbalancer/##')"
          test -n "${ALB_FULL_NAME}"
          for pair in "backend:${BACKEND_TARGET_GROUP_ARN}" "frontend:${FRONTEND_TARGET_GROUP_ARN}"; do
            IFS=: read -r label tg_arn <<<"${pair}"
            TG_FULL_NAME="${tg_arn#*:targetgroup/}"
            TG_FULL_NAME="targetgroup/${TG_FULL_NAME}"
            aws cloudwatch put-metric-alarm \
              --alarm-name "onyxmane-production-${label}-target-5xx" \
              --alarm-description "OnyxMane production ${label} target 5XX responses" \
              --namespace AWS/ApplicationELB \
              --metric-name HTTPCode_Target_5XX_Count \
              --dimensions Name=LoadBalancer,Value="${ALB_FULL_NAME}" Name=TargetGroup,Value="${TG_FULL_NAME}" \
              --statistic Sum --period 60 --evaluation-periods 5 --datapoints-to-alarm 2 \
              --threshold 5 --comparison-operator GreaterThanOrEqualToThreshold \
              --treat-missing-data notBreaching --alarm-actions "${ALERT_TOPIC_ARN}" --ok-actions "${ALERT_TOPIC_ARN}"
          done

      - name: Capture configuration evidence
        run: |
          set -euo pipefail
          mkdir -p production-observability-bootstrap-evidence
          aws application-autoscaling describe-scalable-targets --service-namespace ecs \
            --query 'ScalableTargets[?contains(ResourceId, `service/`)].{ResourceId:ResourceId,MinCapacity:MinCapacity,MaxCapacity:MaxCapacity}' \
            > production-observability-bootstrap-evidence/scalable-targets.json
          aws application-autoscaling describe-scaling-policies --service-namespace ecs \
            --query 'ScalingPolicies[?contains(PolicyName, `onyxmane-`)].{PolicyName:PolicyName,ResourceId:ResourceId,PolicyType:PolicyType}' \
            > production-observability-bootstrap-evidence/scaling-policies.json
          aws cloudwatch describe-alarms --alarm-name-prefix onyxmane-production- \
            --query 'MetricAlarms[].{AlarmName:AlarmName,StateValue:StateValue,ActionsEnabled:ActionsEnabled,Namespace:Namespace,MetricName:MetricName,Threshold:Threshold}' \
            > production-observability-bootstrap-evidence/alarms.json
          jq -n --arg release_sha "${RELEASE_SHA}" --arg min "${MIN_CAPACITY}" --arg max "${MAX_CAPACITY}" \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:1,release_sha:$release_sha,min_capacity:($min|tonumber),max_capacity:($max|tonumber),captured_at:$captured_at}' \
            > production-observability-bootstrap-evidence/manifest.json
          (cd production-observability-bootstrap-evidence && sha256sum *.json > SHA256SUMS)

      - name: Upload configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-observability-bootstrap-${{ inputs.release_sha }}
          path: production-observability-bootstrap-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Production observability bootstrap"
            echo
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- ECS scaling range: \`${MIN_CAPACITY}-${MAX_CAPACITY}\` tasks per service"
            echo "- CPU target tracking target: \`60%\`"
            echo "- Alert topic configured through protected production variable"
            echo
            echo "This workflow mutates only ECS Application Auto Scaling targets/policies and CloudWatch alarms. It does not deploy application code, modify runtime secrets, or change database contents. Running it can affect future ECS capacity and CloudWatch/SNS charges."
          } >> "${GITHUB_STEP_SUMMARY}"
